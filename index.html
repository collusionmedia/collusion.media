<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collusion Media | Video Production</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="banner">
        <div class="banner-top">
            <select id="lang-switch" class="lang-switch">
                <option value="ru">RU</option>
                <option value="en">EN</option>
                <option value="de">DE</option>
                <option value="pl">PL</option>
                <option value="uk">UK</option>
            </select>
        </div>
        
        <h1 class="main-title" data-i18n="portfolioTitle">PORTFOLIO</h1>

        <div class="banner-bottom">
            <div class="contact-links">
                <a href="#" id="link-instagram" target="_blank" class="contact-icon" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#" id="link-phone" class="contact-icon" title="Copy Phone">
                    <i class="fas fa-phone"></i>
                </a>
                <a href="#" id="link-email" class="contact-icon" title="Email Us">
                    <i class="far fa-envelope"></i>
                </a>
            </div>
            <a href="admin.html" class="admin-link"><i class="fas fa-cog"></i></a>
        </div>
    </header>

    <main class="content-wrapper glassmorphism">
        
        <section class="about-section">
            <h2 data-i18n="aboutTitle">О Collusion Media</h2>
            <p id="about-text" data-i18n="aboutText">
                Новый видео продакшн, который работает над музыкальными, коммерческими и творческими проектами.
            </p>
        </section>

        <section class="portfolio-category">
            <h3 data-i18n="catCommercial">Коммерческие работы</h3>
            <div class="video-row" id="row-commercial"></div>
        </section>

        <section class="portfolio-category">
            <h3 data-i18n="catMusic">Музыкальные клипы</h3>
            <div class="video-row" id="row-music"></div>
        </section>

        <section class="portfolio-category">
            <h3 data-i18n="catLifestyle">Лайфстайл</h3>
            <div class="video-row" id="row-lifestyle"></div>
        </section>

        <section class="portfolio-category">
            <h3 data-i18n="catArtists">Артисты</h3>
            <div class="video-row" id="row-artists"></div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
